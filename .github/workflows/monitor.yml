name: Monitor cripto

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 min (UTC). En repo privado usa */30
  workflow_dispatch:
    inputs:
      test:
        description: "Enviar mensaje de prueba con los precios actuales"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: crypto-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Revisar precios
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TEST_MODE: ${{ inputs.test && '1' || '0' }}
        run: python3 monitor.py

      - name: Guardar estado de alertas
        run: |
          git config user.name "crypto-monitor"
          git config user.email "crypto-monitor@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Actualizar estado de alertas [skip ci]" && git pull --rebase && git push)
